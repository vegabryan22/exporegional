<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_upload.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>


    <style>
        body {
            padding-top: 0px;
        }

        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
        }

        .content {
            margin-left: 250px;
            padding: 20px;
        }

        .logo {
            width: 30px;
            height: 30px;
            margin-right: 10px;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h4 class="text-center">
            <img src="/votaciones_backend/static/uploads/ctprgv_logo.png" alt="Logo del Colegio" class="logo">
            Menú de Mantenimiento
        </h4>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" href="{{ url_for('mantenimiento') }}">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('candidatos') }}">
                    <i class="fas fa-user"></i> Candidatos
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('estudiantes') }}">
                    <i class="fas fa-graduation-cap"></i> Estudiantes
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('upload_file') }}">
                    <i class="fas fa-file-upload"></i> Cargar Estudiantes
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('abstencionistas') }}">
                    <i class="fas fa-user-clock"></i> Abstencionistas
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('mantenimiento_sitio') }}">
                    <i class="fas fa-tools"></i> Mantenimiento sitio
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('usuarios') }}">
                    <i class="fas fa-users-cog"></i> Usuarios
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('bitacora_sistema') }}">
                    <i class="fas fa-clipboard-list"></i> Bitacora
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('logout') }}">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </a>
            </li>
        </ul>
    </div>
    <div class="content">
        {% block content %}
        <!-- Contenido específico de cada página aquí -->
        
        {% endblock %}
        <footer class="footer">
            <div class="container text-center">
                <span class="text-muted">© 2025 CTPRGV - Departamento de REDES</span>
            </div>
        </footer>
    </div>
    <!-- Pie de página -->
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
