server {
    listen 80;
    listen 443 ssl http2 ;
    server_name www.ctprobertogamboa.com ctprobertogamboa.com;
    root /www/wwwroot/ctprobertogamboa.ed.cr/html;
    index index.php index.html index.htm default.php default.htm default.html;

    # Estaticos del sistema de votaciones
    location ^~ /votaciones_backend/static/ {
        alias /www/wwwroot/ctprobertogamboa.ed.cr/votaciones_backend/static/;
        access_log off;
        expires 7d;
    }

    # Mantén tu proxy /votaciones
    location /votaciones {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_redirect off;
        disable_symlinks if_not_owner;
    }

    # (Opcional) incluye el well-known del panel si lo usas para emitir desde aaPanel
    # y/o deja también la location explícita como fallback.
    include /www/server/panel/vhost/nginx/well-known/www.ctprobertogamboa.ed.cr.conf;

    # Asegura también la ruta ACME directa (por si el include no existe o falla)
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        alias /www/wwwroot/ctprobertogamboa.ed.cr/.well-known/acme-challenge/;
        try_files $uri =404;
        access_log off;
    }

    # Resto de tus reglas tal cual:
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/www.ctprobertogamboa.ed.cr/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/www.ctprobertogamboa.ed.cr/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;
    include enable-php-84.conf;

    # Archivos estáticos (puedes dejarlos como ya los tienes)
    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ { expires 30d; error_log off; access_log off; }
    location ~ .*\.(js|css)?$ { expires 12h; error_log off; access_log off; }

    # Prohibidos
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) { return 404; }

    # Seguridad básica: permite .well-known pero sin ejecutar nada raro
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) { return 403; }

    access_log /www/wwwlogs/www.ctprobertogamboa.ed.cr.log;
    error_log  /www/wwwlogs/www.ctprobertogamboa.ed.cr.error.log;
}
