{% extends "layout.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Bitacora del sistema</h2>
    <div class="card p-3">
        <div class="table-responsive">
            <table class="table table-striped table-sm">
                <thead><tr><th>Fecha</th><th>Actor</th><th>Accion</th><th>Detalle</th><th>IP</th></tr></thead>
                <tbody>
                {% for e in eventos %}
                <tr>
                    <td>{{ e.created_at }}</td>
                    <td>{{ e.actor }}</td>
                    <td>{{ e.accion }}</td>
                    <td>{{ e.detalle or '-' }}</td>
                    <td>{{ e.ip_origen or '-' }}</td>
                </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
